services:
  - type: web
    name: regnova-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # ✅ PERSISTENT DISK - This is critical!
    disk:
      name: regnova-storage
      mountPath: /app/backend/storage
      sizeGB: 1
    
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: ENVIRONMENT
        value: production

  - type: web
    name: regnova-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://regnova-backend.onrender.com
