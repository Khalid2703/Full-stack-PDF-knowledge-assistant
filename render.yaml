services:
  # Backend API
  - type: web
    name: regnova-backend
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: regnova-db
          property: connectionString
      - key: LLM_MODEL
        value: gemini-1.5-pro
      - key: LLM_TEMPERATURE
        value: 0.7
      - key: RAG_TOP_K
        value: 10
      - key: RAG_RERANK
        value: true
      - key: ENABLE_PROMPT_INJECTION_GUARD
        value: true
      - key: ENABLE_HALLUCINATION_GUARD
        value: true

  # PostgreSQL Database
databases:
  - name: regnova-db
    databaseName: regnova
    user: regnova_user
    plan: free
